<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prime Blueprint — A5 Booklet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside>
      <h2>Prime Blueprint</h2>
      <p>Luxury Renovation Album — A5 Landscape</p>

      <div class="form">
        <input type="text" placeholder="Project Title" id="projectTitle">
        <input type="text" placeholder="Address" id="projectAddress">
        <input type="text" placeholder="Client" id="projectClient">
        <input type="text" placeholder="Date" id="projectDate">
      </div>

      <div class="rooms">
        <button id="addRoom">+ Add Room</button>
        <button id="exportJSON">Export JSON</button>
        <button id="importJSON">Import JSON</button>
      </div>

      <div class="exports">
        <button id="exportPDF">Export PDF</button>
        <button id="exportFlipbook">Export Flipbook (HTML)</button>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <button id="edit">Edit</button>
        <button id="preview">Album Preview</button>
        <button id="regen">Regenerate Copy</button>
        <button id="rebuild">Rebuild Pages</button>
        <button id="save">Save</button>
      </div>
      <div id="workspace"></div>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
