<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Blueprint - Renovation Album</title>
    <style>
        /* CSS Variables - Luxury Color Palette */
        :root {
            --ink: #1C1C1C;
            --stone: #F4F1EC;
            --taupe: #C6B8A6;
            --clay: #9C8363;
            --moss: #6F7B6B;
            --accent: #C8A96B;
            
            /* Dark theme overrides */
            --bg-primary: var(--stone);
            --bg-secondary: #ffffff;
            --text-primary: var(--ink);
            --text-secondary: var(--clay);
            --border-light: rgba(0, 0, 0, 0.08);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --text-primary: var(--stone);
            --text-secondary: var(--taupe);
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* Typography */
        .heading-font {
            font-family: "Garamond", "Palatino Linotype", "Times New Roman", serif;
            letter-spacing: -0.02em;
        }

        .body-font {
            font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
            line-height: 1.6;
        }

        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Layout */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .brand-header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .rooms-section {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .room-item {
            padding: 0.75rem 1rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        .room-item.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .room-info {
            flex: 1;
        }

        .room-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .room-type {
            font-size: 0.75rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .room-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .room-item:hover .room-actions {
            opacity: 1;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #b8965a;
            transform: translateY(-1px);
            box-shadow: var(--shadow-hover);
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .btn-secondary:hover {
            background: var(--taupe);
            color: white;
        }

        .btn-small {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .btn-icon {
            padding: 0.5rem;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-room-btn {
            width: 100%;
            margin-top: 1rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-header {
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .global-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Export Dropdown */
        .export-dropdown {
            position: relative;
        }

        .dropdown-toggle::after {
            content: '';
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            box-shadow: var(--shadow-hover);
            min-width: 200px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            text-align: left;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 0;
            transition: background-color 0.2s ease;
        }

        .dropdown-item:hover {
            background: var(--taupe);
            color: white;
        }

        .dropdown-item:first-child {
            border-radius: 8px 8px 0 0;
        }

        .dropdown-item:last-child {
            border-radius: 0 0 8px 8px;
        }

        .main-body {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        /* Room Editor */
        .room-editor {
            max-width: 800px;
            margin: 0 auto;
        }

        .room-title-section {
            margin-bottom: 3rem;
        }

        .room-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .room-title::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--accent);
        }

        .room-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: var(--accent);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Photo Sections */
        .photo-section {
            margin-bottom: 3rem;
        }

        .photo-section-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        /* During Photos - Special Styling */
        .photo-section.during {
            background: rgba(200, 169, 107, 0.05);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid rgba(200, 169, 107, 0.2);
        }

        .photo-section.during .photo-section-title {
            color: var(--accent);
            text-align: center;
        }

        .upload-zone {
            border: 2px dashed var(--border-light);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-secondary);
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--stone);
        }

        .upload-zone.drag-over {
            border-color: var(--accent);
            background: rgba(200, 169, 107, 0.1);
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .upload-subtext {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        /* During photos get smaller grid */
        .photo-section.during .photo-grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.75rem;
        }

        .photo-item {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .photo-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .photo-frame {
            padding: 12px;
            background: var(--stone);
        }

        /* During photos get smaller frames */
        .photo-section.during .photo-frame {
            padding: 8px;
        }

        .photo-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            cursor: pointer;
        }

        /* During photos get smaller height */
        .photo-section.during .photo-image {
            height: 100px;
        }

        .photo-caption {
            padding: 1rem;
        }

        .photo-caption input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.875rem;
            padding: 0.25rem 0;
        }

        .photo-caption input:focus {
            outline: none;
            border-bottom: 1px solid var(--accent);
        }

        .photo-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .photo-item:hover .photo-actions {
            opacity: 1;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        /* Album Preview */
        .album-preview {
            background: white;
            color: var(--ink);
            min-height: 100vh;
        }

        .cover-page {
            padding: 4rem 3rem;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-bottom: 1px solid var(--border-light);
            page-break-after: always;
        }

        .cover-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--ink);
        }

        .cover-subtitle {
            font-size: 1.25rem;
            color: var(--clay);
            margin-bottom: 3rem;
        }

        .cover-brand {
            margin-top: auto;
            font-size: 1rem;
            color: var(--accent);
            font-weight: 600;
        }

        .toc-page {
            padding: 3rem;
            page-break-after: always;
        }

        .toc-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--ink);
            text-align: center;
        }

        .toc-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-light);
        }

        .room-page {
            padding: 3rem;
            page-break-before: always;
            min-height: 100vh;
        }

        .room-page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--ink);
            position: relative;
            padding-bottom: 1rem;
        }

        .room-page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 2px;
            background: var(--accent);
        }

        .room-photos-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin: 3rem 0;
        }

        .photos-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .column-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--clay);
        }

        .photo-collage {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .collage-photo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            padding: 8px;
            background: var(--stone);
        }

        /* During Section in Print */
        .during-section {
            margin: 2rem 0;
            page-break-inside: avoid;
        }

        .during-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.5rem;
        }

        .during-photo {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-light);
            padding: 4px;
            background: var(--stone);
        }

        .during-caption {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .room-description {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--clay);
            margin-bottom: 2rem;
            font-style: italic;
        }

        .room-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border-light);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-prev {
            left: -60px;
        }

        .lightbox-next {
            right: -60px;
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-hover);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-hover);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1100;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Theme Toggle */
        .theme-toggle {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        /* Onboarding */
        .onboarding {
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .onboarding-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .onboarding-text {
            font-size: 0.875rem;
            line-height: 1.5;
        }

        /* Hide elements in print mode */
        @media print {
            .sidebar,
            .main-header,
            .btn,
            .modal-overlay,
            .lightbox,
            .toast,
            .onboarding,
            .photo-actions,
            .room-actions,
            .upload-zone {
                display: none !important;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .album-preview {
                background: white;
                color: var(--ink);
            }
            
            /* Force light theme for print */
            :root {
                --bg-primary: white;
                --bg-secondary: white;
                --text-primary: var(--ink);
                --text-secondary: var(--clay);
                --border-light: rgba(0, 0, 0, 0.08);
            }
            
            @page {
                size: A4 portrait;
                margin: 12mm;
            }
            
            .room-page {
                page-break-before: always;
                page-break-inside: avoid;
            }
            
            .photo-collage {
                page-break-inside: avoid;
            }
            
            .room-photos-layout {
                page-break-inside: avoid;
            }

            .during-section {
                page-break-inside: avoid;
            }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

        /* File input hidden */
        .file-input {
            display: none;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .empty-state-text {
            font-size: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body data-theme="light">
    <!-- App Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand-header">
                <div class="brand-title heading-font">Prime Blueprint</div>
                <div class="brand-subtitle body-font">Renovation Albums</div>
            </div>
            
            <div class="rooms-section">
                <div class="section-title">Project Rooms</div>
                <div id="rooms-list"></div>
                <button class="btn btn-primary add-room-btn" onclick="showAddRoomModal()">
                    + Add Room
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="main-header">
                <div class="tabs">
                    <button class="tab active body-font" data-tab="edit" onclick="switchTab('edit')">Edit</button>
                    <button class="tab body-font" data-tab="preview" onclick="switchTab('preview')">Album Preview</button>
                </div>
                
                <div class="global-actions">
                    <div class="export-dropdown">
                        <button class="btn btn-primary dropdown-toggle" onclick="toggleExportDropdown()">
                            Export ▼
                        </button>
                        <div class="dropdown-menu" id="export-dropdown">
                            <button class="dropdown-item" onclick="exportPDF()">📄 Export PDF (A4 Booklet)</button>
                            <button class="dropdown-item" onclick="exportFlipbook()">📖 Export Flipbook (HTML)</button>
                            <button class="dropdown-item" onclick="exportJSON()">💾 Export JSON</button>
                        </div>
                    </div>
                    <button class="btn btn-secondary" onclick="importJSON()">Import JSON</button>
                    <button class="btn btn-secondary theme-toggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>

            <div class="main-body">
                <!-- Edit Tab -->
                <div id="edit-tab" class="tab-content">
                    <div id="room-editor" class="room-editor"></div>
                </div>

                <!-- Preview Tab -->
                <div id="preview-tab" class="tab-content hidden">
                    <div id="album-preview" class="album-preview"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">✕</button>
            <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">‹</button>
            <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">›</button>
            <img class="lightbox-image" id="lightbox-image" src="" alt="">
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="add-room-modal">
        <div class="modal">
            <div class="modal-title heading-font">Add New Room</div>
            <div class="form-group">
                <label class="form-label">Room Name</label>
                <input type="text" class="form-input" id="room-name-input" placeholder="e.g., Master Bedroom">
            </div>
            <div class="form-group">
                <label class="form-label">Room Type</label>
                <select class="form-input" id="room-type-input">
                    <option value="Bedroom">Bedroom</option>
                    <option value="Living">Living</option>
                    <option value="Kitchen">Kitchen</option>
                    <option value="Dining">Dining</option>
                    <option value="Bathroom">Bathroom</option>
                    <option value="WC">WC</option>
                    <option value="Hallway">Hallway</option>
                    <option value="Office">Office</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideAddRoomModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addRoom()">Add Room</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal">
            <div class="modal-title heading-font" id="confirm-title"></div>
            <div id="confirm-message"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideConfirmModal()">Cancel</button>
                <button class="btn btn-danger" id="confirm-action" onclick="">Confirm</button>
            </div>
        </div>
    </div>

    <!-- File Input -->
    <input type="file" class="file-input" id="file-input" multiple accept="image/*">
    <input type="file" class="file-input" id="json-input" accept=".json">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // State Management
        let state = {
            album: {
                projectTitle: '',
                address: '',
                client: '',
                rooms: []
            },
            currentRoom: null,
            currentTab: 'edit',
            lightboxIndex: 0,
            lightboxPhotos: [],
            theme: 'light'
        };

        // Room Type Detection
        const roomTypeKeywords = {
            'Bedroom': ['bed', 'bedroom', 'master', 'guest'],
            'Living': ['living', 'lounge', 'family', 'great room'],
            'Kitchen': ['kitchen', 'cook', 'culinary'],
            'Dining': ['dining', 'eat', 'breakfast'],
            'Bathroom': ['bath', 'bathroom', 'master bath', 'ensuite'],
            'WC': ['wc', 'powder', 'half bath', 'guest bath'],
            'Hallway': ['hall', 'hallway', 'entry', 'foyer', 'entrance'],
            'Office': ['office', 'study', 'den', 'library', 'work']
        };

        // Room Blurb Templates
        const roomBlurbs = {
            'Bedroom': [
                "A calm, layered palette with soft textures and controlled lighting creates a restful sanctuary. Bespoke joinery maximises storage while keeping sightlines clean.",
                "Thoughtful material selection and refined proportions establish a serene retreat. Natural light filters gently through considered window treatments.",
                "Understated luxury through tactile fabrics and warm timber accents. The design prioritizes rest and rejuvenation above all else."
            ],
            'Dining': [
                "Warm timber and balanced illumination shape an intimate setting for gatherings. Proportions and circulation are refined to host comfortably.",
                "Architectural lighting and rich materials create an elevated dining experience. The space encourages lingering conversation.",
                "Careful attention to acoustics and sight lines ensures every seat feels special. Natural textures add warmth to formal occasions."
            ],
            'Bathroom': [
                "Stone-inspired finishes and minimal hardware deliver a spa-level quiet. Task and ambient lighting are tuned to flatter skin tones and surfaces.",
                "Premium materials and concealed storage create a serene daily ritual space. Every surface is selected for both beauty and durability.",
                "Refined fixtures and considered proportions transform routine into luxury. The palette remains timeless and calming."
            ],
            'WC': [
                "Stone-inspired finishes and minimal hardware deliver a spa-level quiet. Clean lines and premium fixtures create an elevated powder room experience.",
                "Compact luxury with oversized impact. Rich materials and architectural lighting make the most of intimate proportions.",
                "Thoughtful details and refined finishes ensure guests feel welcomed. The design maximizes visual space through careful material selection."
            ],
            'Kitchen': [
                "Functional workflow wrapped in understated materials. Integrated lighting and durable finishes support daily use without visual noise.",
                "Professional-grade functionality meets residential warmth. Hidden storage and seamless surfaces maintain the clean aesthetic.",
                "Thoughtful zoning and premium appliances create an intuitive cooking environment. Materials age gracefully with daily use."
            ],
            'Living': [
                "Neutral foundations with tactile accents. Furniture layout optimises conversation, daylight, and evening ambience.",
                "Layered textures and considered proportions create a sophisticated gathering space. Natural materials add warmth to clean lines.",
                "Flexible seating arrangements accommodate both intimate conversations and larger gatherings. The palette remains timeless and inviting."
            ],
            'Hallway': [
                "A restrained welcome with durable surfaces and clear wayfinding. Light guides movement and expands perceived width.",
                "Architectural details and considered lighting transform circulation into experience. Storage solutions remain invisible yet accessible.",
                "Clean lines and rich materials create a sophisticated transition between spaces. Every surface serves both form and function."
            ],
            'Office': [
                "Acoustic softness, controlled colour, and ergonomic layout enhance focus. Cable and storage management keep sightlines calm.",
                "Natural light and considered furniture placement support long work sessions. Rich textures add warmth to the productive environment.",
                "Thoughtful zoning separates focused work from video calls. Premium materials ensure the space feels both professional and comfortable."
            ],
            'Other': [
                "Refined proportions and premium materials create a sophisticated space. Natural light and considered details enhance the architectural character.",
                "Thoughtful material selection and careful detailing establish a cohesive design language. The space feels both timeless and contemporary.",
                "Clean lines and rich textures come together in perfect balance. Every element serves the room's unique purpose with understated elegance."
            ]
        };

        // Utility Functions
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function detectRoomType(name) {
            const lowerName = name.toLowerCase();
            for (const [type, keywords] of Object.entries(roomTypeKeywords)) {
                if (keywords.some(keyword => lowerName.includes(keyword))) {
                    return type;
                }
            }
            return 'Other';
        }

        function generateBlurb(type) {
            const templates = roomBlurbs[type] || roomBlurbs['Other'];
            return templates[Math.floor(Math.random() * templates.length)];
        }

        function generateProjectCode() {
            const year = new Date().getFullYear();
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'PB-' + year + '-';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function cleanFileName(filename) {
            // Remove common device prefixes and clean up
            let cleaned = filename.replace(/\.(jpg|jpeg|png|gif|webp)$/i, '');
            cleaned = cleaned.replace(/^(IMG_|DSC_|PHOTO_|PXL_)/i, '');
            
            // If it looks like a date/number sequence, make it generic
            if (/^\d{8}_\d{6}/.test(cleaned) || /^\d{4}-\d{2}-\d{2}/.test(cleaned)) {
                return 'Photo';
            }
            
            return cleaned || 'Photo';
        }

        // Storage Functions
        function saveToStorage() {
            try {
                localStorage.setItem('prime-blueprint-album', JSON.stringify(state.album));
                localStorage.setItem('prime-blueprint-settings', JSON.stringify({
                    theme: state.theme
                }));
            } catch (e) {
                showToast('Storage full! Export your data as JSON.', 'warning');
            }
        }

        function loadFromStorage() {
            try {
                const saved = localStorage.getItem('prime-blueprint-album');
                if (saved) {
                    state.album = JSON.parse(saved);
                }
                
                const settings = localStorage.getItem('prime-blueprint-settings');
                if (settings) {
                    const parsed = JSON.parse(settings);
                    state.theme = parsed.theme || 'light';
                    document.body.setAttribute('data-theme', state.theme);
                }
            } catch (e) {
                console.error('Failed to load from storage:', e);
            }
        }

        // Theme Functions
        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', state.theme);
            document.querySelector('.theme-toggle').textContent = state.theme === 'light' ? '🌙' : '☀️';
            saveToStorage();
        }

        // Toast Functions
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Tab Functions
        function switchTab(tab) {
            state.currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            // Show/hide content
            document.getElementById('edit-tab').classList.toggle('hidden', tab !== 'edit');
            document.getElementById('preview-tab').classList.toggle('hidden', tab !== 'preview');
            
            if (tab === 'preview') {
                renderAlbumPreview();
            }
        }

        // Room Management
        function showAddRoomModal() {
            document.getElementById('add-room-modal').classList.add('active');
            document.getElementById('room-name-input').focus();
        }

        function hideAddRoomModal() {
            document.getElementById('add-room-modal').classList.remove('active');
            document.getElementById('room-name-input').value = '';
            document.getElementById('room-type-input').value = 'Bedroom';
        }

        function addRoom() {
            const name = document.getElementById('room-name-input').value.trim();
            const type = document.getElementById('room-type-input').value;
            
            if (!name) {
                showToast('Please enter a room name', 'error');
                return;
            }
            
            const room = {
                id: generateId(),
                name: name,
                type: type,
                before: [],
                during: [], // 🆕 Added during photos
                after: [],
                blurb: generateBlurb(type),
                meta: {
                    durationWeeks: Math.floor(Math.random() * 7) + 6, // 6-12 weeks
                    projectCode: generateProjectCode(),
                    year: new Date().getFullYear()
                }
            };
            
            state.album.rooms.push(room);
            state.currentRoom = room.id;
            
            hideAddRoomModal();
            renderRoomsList();
            renderRoomEditor();
            saveToStorage();
            showToast(`Added ${name}`);
        }
